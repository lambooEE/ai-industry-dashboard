<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Industry Tracker V3</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2332;
  --bg-card-hover: #1e293b;
  --border: #2d3748;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --green: #10b981;
  --red: #ef4444;
  --orange: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --cyan: #06b6d4;
  --sidebar-width: 260px;
  --navbar-height: 56px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.navbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--navbar-height);
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; z-index: 100; gap: 16px;
}
.navbar-logo { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.navbar-logo .icon { font-size: 22px; }
.market-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.freshness-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.freshness-dot.green { background: var(--green); }
.freshness-dot.yellow { background: var(--orange); }
.freshness-dot.red { background: var(--red); }
.navbar-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.navbar-search { flex: 1; max-width: 360px; position: relative; }
.navbar-search input {
  width: 100%; padding: 6px 12px 6px 32px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text-primary); font-size: 13px;
  outline: none; transition: border-color 0.2s;
}
.navbar-search input:focus { border-color: var(--accent); }
.navbar-search .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
.lang-btn {
  padding: 4px 12px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-secondary); cursor: pointer;
  font-size: 12px; font-weight: 600; transition: all 0.2s; white-space: nowrap;
}
.lang-btn:hover { border-color: var(--accent); color: var(--accent); }
.hamburger { display: none; background: none; border: none; color: var(--text-primary); font-size: 20px; cursor: pointer; }

.sidebar {
  position: fixed; top: var(--navbar-height); left: 0;
  width: var(--sidebar-width); height: calc(100vh - var(--navbar-height));
  background: var(--bg-secondary); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px; transition: transform 0.3s; z-index: 90;
}
.sidebar.collapsed { transform: translateX(-100%); }
.sidebar-toggle {
  position: fixed; top: calc(var(--navbar-height) + 10px); left: var(--sidebar-width);
  background: var(--bg-card); border: 1px solid var(--border); border-left: none;
  border-radius: 0 4px 4px 0; padding: 6px 4px; cursor: pointer;
  color: var(--text-muted); z-index: 91; transition: left 0.3s; font-size: 12px;
}
.sidebar.collapsed ~ .sidebar-toggle { left: 0; }
.stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--bg-card); border-radius: 6px; padding: 10px; text-align: center; border: 1px solid var(--border); }
.stat-card .value { font-size: 20px; font-weight: 700; line-height: 1.2; }
.stat-card .label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.sidebar-section { margin-bottom: 16px; }
.sidebar-section h4 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.sector-list-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.2s; margin-bottom: 2px; }
.sector-list-item:hover { background: var(--bg-card-hover); }
.sector-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sector-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sector-count { color: var(--text-muted); font-size: 11px; }
.quadrant-legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; }
.quadrant-legend-item { display: flex; align-items: center; gap: 4px; }

.main-content {
  margin-top: var(--navbar-height); margin-left: var(--sidebar-width);
  padding: 20px; min-height: calc(100vh - var(--navbar-height));
  transition: margin-left 0.3s;
}
.sidebar.collapsed ~ .main-content { margin-left: 0; }

.tab-bar { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; padding-bottom: 0; }
.tab-btn { padding: 10px 16px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; white-space: nowrap; transition: all 0.2s; }
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.data-timestamp { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 12px; color: var(--text-muted); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--bg-card); border-radius: 8px; padding: 20px; border: 1px solid var(--border); position: relative; }
.kpi-card .kpi-icon { position: absolute; top: 16px; right: 16px; font-size: 24px; opacity: 0.3; }
.kpi-card .kpi-value { font-size: 28px; font-weight: 700; line-height: 1.2; }
.kpi-card .kpi-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.kpi-card .kpi-sub { font-size: 11px; color: var(--text-secondary); margin-top: 8px; }

.chart-container { background: var(--bg-card); border-radius: 8px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
.chart-container h3 { font-size: 14px; margin-bottom: 12px; color: var(--text-secondary); }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.quadrant-matrix { background: var(--bg-card); border-radius: 8px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; position: relative; }
.quadrant-matrix canvas { width: 100%; cursor: crosshair; }

.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; cursor: pointer; white-space: nowrap; position: sticky; top: 0; background: var(--bg-card); }
.data-table th:hover { color: var(--text-secondary); }
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table tr:hover { background: var(--bg-card-hover); }
.data-table .positive { color: var(--green); }
.data-table .negative { color: var(--red); }
.table-wrapper { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); overflow: auto; max-height: 70vh; margin-bottom: 20px; }
.sort-icon { font-size: 10px; margin-left: 4px; opacity: 0.5; }

.sector-score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
.sector-score-card { background: var(--bg-card); border-radius: 8px; padding: 16px; border: 1px solid var(--border); cursor: pointer; transition: border-color 0.2s; }
.sector-score-card:hover { border-color: var(--accent); }
.sector-score-card .header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.sector-score-card .header h4 { font-size: 13px; flex: 1; }
.sector-score-card .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sector-score-card .score-item { font-size: 11px; }
.sector-score-card .score-item .label { color: var(--text-muted); }
.sector-score-card .score-item .value { font-weight: 600; }
.sector-expand { margin-top: 8px; font-size: 11px; color: var(--accent); cursor: pointer; }
.arrow-up { color: var(--green); }
.arrow-down { color: var(--red); }
.arrow-flat { color: var(--text-muted); }

.heatmap-grid { display: grid; gap: 2px; margin-bottom: 20px; }
.heatmap-cell { border-radius: 3px; text-align: center; font-size: 10px; display: flex; align-items: center; justify-content: center; min-height: 28px; }

.alert-group { margin-bottom: 16px; }
.alert-group h4 { font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.alert-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg-card); border-radius: 6px; margin-bottom: 4px; border-left: 3px solid var(--red); font-size: 13px; }
.alert-item.medium { border-left-color: var(--orange); }
.alert-icon { font-size: 16px; }

.decision-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.decision-card { background: var(--bg-card); border-radius: 8px; padding: 20px; border: 1px solid var(--border); }
.decision-card h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
.decision-card ul { list-style: none; padding: 0; }
.decision-card li { padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.decision-card li:last-child { border-bottom: none; }

.pool-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.pool-sector-group { background: var(--bg-card); border-radius: 8px; padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; }
.pool-sector-group h4 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; cursor: pointer; }
.pool-stock-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 12px; border-radius: 4px; margin-bottom: 2px; }
.pool-stock-item:hover { background: var(--bg-card-hover); }
.remove-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 14px; opacity: 0.6; transition: opacity 0.2s; }
.remove-btn:hover { opacity: 1; }
.add-form { background: var(--bg-card); border-radius: 8px; padding: 16px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.add-form .field { display: flex; flex-direction: column; gap: 4px; }
.add-form label { font-size: 11px; color: var(--text-muted); }
.add-form input, .add-form select { padding: 6px 10px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 13px; }
.add-form .add-btn { padding: 6px 16px; background: var(--accent); border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 13px; }
.add-form .add-btn:hover { background: var(--accent-hover); }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg-secondary); border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h3 { font-size: 18px; }
.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-field { font-size: 13px; }
.modal-field .label { color: var(--text-muted); font-size: 11px; }
.modal-field .value { font-weight: 600; margin-top: 2px; }
.sparkline-canvas { width: 100%; height: 60px; margin: 12px 0; }

.macro-card { background: var(--bg-card); border-radius: 8px; padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
.macro-card h3 { font-size: 14px; margin-bottom: 12px; }
.macro-indicators { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.macro-indicator { background: var(--bg-card); border-radius: 8px; padding: 16px; border: 1px solid var(--border); }
.macro-indicator .mi-label { font-size: 11px; color: var(--text-muted); }
.macro-indicator .mi-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
.macro-indicator .mi-desc { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-item { position: relative; margin-bottom: 16px; font-size: 13px; }
.timeline-item::before { content: ''; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-card); }
.timeline-item .tl-date { font-size: 11px; color: var(--text-muted); }
.timeline-item .tl-text { margin-top: 2px; }

.search-highlight { background: rgba(59,130,246,0.3); border-radius: 2px; padding: 0 2px; }

@media (max-width: 768px) {
  .hamburger { display: block; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.mobile-open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .chart-row { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .navbar-search { max-width: 180px; }
}

.currency-selector {
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.currency-selector label {
  font-size: 11px; color: var(--text-muted); cursor: default;
}
.currency-selector select {
  padding: 4px 8px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-secondary); font-size: 12px;
  cursor: pointer; outline: none; transition: border-color 0.2s;
}
.currency-selector select:hover { border-color: var(--accent); }
.currency-selector select:focus { border-color: var(--accent); }

/* Financial Overview Tab */
.fin-overview-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px; margin-bottom: 20px;
}
.fin-card {
  background: var(--bg-card); border-radius: 8px; padding: 20px;
  border: 1px solid var(--border); transition: border-color 0.2s;
}
.fin-card:hover { border-color: var(--accent); }
.fin-card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.fin-card-header h4 { font-size: 15px; font-weight: 700; }
.fin-card-header .fin-ticker { font-size: 12px; color: var(--text-muted); }
.fin-section { margin-bottom: 12px; }
.fin-section-title {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 6px; padding-left: 2px;
}
.fin-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fin-metric {
  display: flex; justify-content: space-between; align-items: center;
  padding: 3px 6px; border-radius: 3px; font-size: 12px;
}
.fin-metric:hover { background: var(--bg-card-hover); }
.fin-metric .fin-label { color: var(--text-secondary); }
.fin-metric .fin-value { font-weight: 600; }
.fin-card-currency {
  font-size: 10px; color: var(--text-muted); padding: 2px 6px;
  background: var(--bg-secondary); border-radius: 3px; margin-left: 8px;
}
.fin-no-data { font-size: 12px; color: var(--text-muted); text-align: center; padding: 40px; }

</style>
</head>
<body>

<nav class="navbar">
  <button class="hamburger" onclick="toggleMobileSidebar()">&#9776;</button>
  <div class="navbar-logo"><span class="icon">🤖</span> AI Industry Tracker</div>
  <div class="market-indicator">
    <span class="freshness-dot green" id="marketDot"></span>
    <span id="marketStatus">Market Open</span>
  </div>
  <div class="navbar-date" id="navDate"></div>
  <div class="navbar-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="globalSearch" placeholder="Search ticker or company..." oninput="handleGlobalSearch(this.value)">
  </div>
  <div class="currency-selector">
  <label id="currencyLabel">报告货币</label>
  <select id="currencySelect" onchange="changeCurrency(this.value)">
    <option value="USD">USD</option>
    <option value="TWD">TWD</option>
    <option value="CNY">CNY</option>
    <option value="EUR">EUR</option>
    <option value="JPY">JPY</option>
    <option value="GBP">GBP</option>
    <option value="SGD">SGD</option>
    <option value="HKD">HKD</option>
  </select>
</div>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
  <div class="market-indicator">
    <span class="freshness-dot green" id="dataDot"></span>
    <span id="freshnessLabel">Fresh</span>
  </div>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="stat-cards" id="sidebarStats"></div>
  <div class="sidebar-section">
    <h4 id="sectorsTitle">SECTORS</h4>
    <div id="sidebarSectorList"></div>
  </div>
  <div class="sidebar-section">
    <h4 id="legendTitle">QUADRANT</h4>
    <div class="quadrant-legend" id="quadrantLegend"></div>
  </div>
</aside>
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">◀</button>

<div class="main-content" id="mainContent">
  <div class="tab-bar" id="tabBar"></div>
  <div id="tabPanels"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

function formatMktCap(v) {
  if (!v || v === 0) return 'N/A';
  var converted = convertAmount(v, 'USD', reportingCurrency);
  if (Math.abs(converted) >= 1e12) return reportingCurrency + ' ' + (converted/1e12).toFixed(2) + 'T';
  if (Math.abs(converted) >= 1e9) return reportingCurrency + ' ' + (converted/1e9).toFixed(2) + 'B';
  if (Math.abs(converted) >= 1e6) return reportingCurrency + ' ' + (converted/1e6).toFixed(1) + 'M';
  return reportingCurrency + ' ' + converted.toFixed(0);
}

function formatVolume(v) {
  if (!v) return 'N/A';
  if (v >= 1e9) return (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return v.toFixed(0);
}

function formatPct(v, decimals) {
  if (v === null || v === undefined) return 'N/A';
  decimals = decimals || 2;
  return (v >= 0 ? '+' : '') + v.toFixed(decimals) + '%';
}

function pctClass(v) { return v >= 0 ? 'positive' : 'negative'; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }


// ========== Reporting Currency ==========
function changeCurrency(cur) {
  reportingCurrency = cur;
  localStorage.setItem('dashboard_reporting_currency', cur);
  renderAll();
}

function getExchangeRate(fromCur, toCur) {
  // All rates in exchangeRates are USD->XXX
  if (fromCur === toCur) return 1;
  if (fromCur === 'USD') return exchangeRates[toCur] || 1;
  if (toCur === 'USD') return 1 / (exchangeRates[fromCur] || 1);
  // Cross rate: fromCur -> USD -> toCur
  var fromToUsd = 1 / (exchangeRates[fromCur] || 1);
  var usdToTo = exchangeRates[toCur] || 1;
  return fromToUsd * usdToTo;
}

function convertAmount(value, fromCur, toCur) {
  if (!value || fromCur === toCur) return value;
  return value * getExchangeRate(fromCur, toCur);
}

function formatCurrency(amount, cur) {
  if (amount === null || amount === undefined || isNaN(amount)) return 'N/A';
  cur = cur || reportingCurrency;
  var abs = Math.abs(amount);
  var formatted;
  if (abs >= 1e12) formatted = (amount / 1e12).toFixed(2) + 'T';
  else if (abs >= 1e9) formatted = (amount / 1e9).toFixed(2) + 'B';
  else if (abs >= 1e6) formatted = (amount / 1e6).toFixed(1) + 'M';
  else if (abs >= 1e3) formatted = (amount / 1e3).toFixed(1) + 'K';
  else formatted = amount.toFixed(2);
  return cur + ' ' + formatted;
}

function formatRate(rate) {
  if (!rate || isNaN(rate)) return 'N/A';
  if (rate >= 100) return rate.toFixed(2);
  if (rate >= 1) return rate.toFixed(4);
  return rate.toFixed(6);
}

    // Helper to get metric value converted to reporting currency

      if (ratioMetrics.indexOf(metricKey) >= 0) return val;
      // For per-share metrics, convert using currency rate

      if (perShareMetrics.indexOf(metricKey) >= 0) return convertAmount(val, mc, reportingCurrency);
      // For absolute amount metrics, convert

      if (ratioMetrics.indexOf(metricKey) >= 0) return val.toFixed(2) + '%';
      var perShareMetrics = ['eps_diluted','book_value_per_share'];

function renderNavbar() {
  // US market hours in Eastern Time (auto-handles EDT/EST)
  const now = new Date();
  const etStr = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour12: false,
    weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit'
  }).format(now);
  const etMatch = etStr.match(/(\w+)\s+(\d{2}):(\d{2}):(\d{2})/);
  const etDay = etMatch[1];
  const etH = parseInt(etMatch[2]);
  const etM = parseInt(etMatch[3]);
  const etTime = etH * 60 + etM;
  const etIsWeekday = ['Mon','Tue','Wed','Thu','Fri'].indexOf(etDay) !== -1;
  // NYSE: 9:30 AM - 4:00 PM ET
  const marketOpen = etIsWeekday && etTime >= 570 && etTime < 960;
  document.getElementById('marketDot').className = 'freshness-dot ' + (marketOpen ? 'green' : 'red');
  document.getElementById('marketStatus').textContent = marketOpen ? 'Market Open' : 'Market Closed';
  document.getElementById('navDate').textContent = reportDate + ' | Wisesheets API';
  document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中';
  document.getElementById('currencyLabel').textContent = t('reporting_currency');
  document.getElementById('currencySelect').value = reportingCurrency;
  document.getElementById('globalSearch').placeholder = t('search_placeholder');
  var daysDiff = 1;
  var dotEl = document.getElementById('dataDot');
  var freshLabel = document.getElementById('freshnessLabel');
  if (daysDiff <= 1) { dotEl.className = 'freshness-dot green'; freshLabel.textContent = currentLang === 'zh' ? '新鲜' : 'Fresh'; }
  else if (daysDiff <= 3) { dotEl.className = 'freshness-dot yellow'; freshLabel.textContent = currentLang === 'zh' ? '较旧' : 'Stale'; }
  else { dotEl.className = 'freshness-dot red'; freshLabel.textContent = currentLang === 'zh' ? '过期' : 'Expired'; }
}

function initQuadrantCanvas(canvasId) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  var W = rect.width - 40;
  var H = parseInt(canvas.getAttribute('height')) || 420;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  var pad = 60;
  var cw = W - pad * 2;
  var ch = H - pad * 2;
  var rsMin = -200, rsMax = 300;
  var mcMin = -80, mcMax = 20;

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 5; i++) {
    var x = pad + (cw / 5) * i;
    var y = pad + (ch / 5) * i;
    ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, pad + ch); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad + cw, y); ctx.stroke();
  }

  var zeroX = pad + cw * (0 - rsMin) / (rsMax - rsMin);
  var zeroY = pad + ch * (0 - mcMin) / (mcMax - mcMin);
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(zeroX, pad); ctx.lineTo(zeroX, pad + ch); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, zeroY); ctx.lineTo(pad + cw, zeroY); ctx.stroke();
  ctx.setLineDash([]);

  ctx.font = '12px sans-serif';
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = QC.leading; ctx.fillText(t('leading'), zeroX + 8, pad + 18);
  ctx.fillStyle = QC.improving; ctx.fillText(t('improving'), pad + 8, pad + 18);
  ctx.fillStyle = QC.weakening; ctx.fillText(t('weakening'), zeroX + 8, zeroY + 18);
  ctx.fillStyle = QC.lagging; ctx.fillText(t('lagging'), pad + 8, zeroY + 18);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px sans-serif';
  ctx.fillText('6M ' + t('relative_strength') + ' →', pad + cw - 80, pad + ch + 30);
  ctx.save();
  ctx.translate(14, pad + ch/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('↑ WoW ' + t('momentum_change'), 0, 0);
  ctx.restore();

  allSectors.forEach(function(s) {
    var rs = clamp(s.relative_strength, rsMin, rsMax);
    var mc = clamp(s.momentum_change, mcMin, mcMax);
    var sx = pad + cw * (rs - rsMin) / (rsMax - rsMin);
    var sy = pad + ch * (mcMax - mc) / (mcMax - mcMin);
    var color = QC[s.quadrant];
    var label = SA[s.sector_en] || (currentLang === 'zh' ? s.sector_zh : s.sector_en);

    ctx.beginPath();
    ctx.arc(sx, sy, 12, 0, Math.PI * 2);
    ctx.fillStyle = color + '22';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx, sy, 5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '10px sans-serif';
    ctx.fillText(label, sx + 8, sy + 3);
  });

  ctx.fillStyle = '#f59e0b88';
  ctx.font = '9px sans-serif';
  ctx.fillText('* Memory&Storage RS clamped: 1156.9→300', pad + 4, pad + ch + 44);
}

    var chgClass = pctClass(s.change_pct);
    var sectDisplay = currentLang === 'zh' ? s.sector_zh : s.sector_en;
    rows += '<tr onclick="showStockModal(\'' + s.ticker + '\')" style="cursor:pointer">' +
      '<td><strong>' + s.ticker + '</strong></td>' +
      '<td>' + name + '</td>' +
      '<td>' + sectDisplay + '</td>' +
      '<td>$' + s.close.toFixed(2) + '</td>' +
      '<td class="' + chgClass + '">' + formatPct(s.change_pct) + '</td>' +
      '<td>' + formatVolume(s.volume) + '</td>' +
      '<td>' + (s.pe ? s.pe.toFixed(1) : 'N/A') + '</td>' +
      '<td>' + formatMktCap(s.market_cap) + '</td>' +
      '<td>' + (s.gross_margin ? s.gross_margin.toFixed(1) + '%' : 'N/A') + '</td>' +
    '</tr>';
  });

  return dataTimestamp() +
    '<div class="table-wrapper"><table class="data-table"><thead><tr>' + headers + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="font-size:12px;color:var(--text-muted)">' + (currentLang === 'zh' ? '共' : 'Total') + ' ' + filteredStocks.length + ' ' + (currentLang === 'zh' ? '只股票' : 'stocks') + '</div>';
}

function sortTable(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  renderTabPanels();
}

// ===== Tab 5: Risk =====
function renderRisk() {
  var riskTypes = ['pe_negative','price_extreme','high_leverage','liquidity_risk','near_52w_low'];
  var riskCounts = {};
  riskTypes.forEach(function(rt) { riskCounts[rt] = allRisks.filter(function(r) { return r.risk_type === rt; }).length; });
  var riskColors = { pe_negative: 'var(--red)', price_extreme: 'var(--orange)', high_leverage: 'var(--purple)', liquidity_risk: 'var(--cyan)', near_52w_low: 'var(--text-muted)' };

  var kpiHtml = '';
  riskTypes.forEach(function(rt) {
    kpiHtml += '<div class="kpi-card"><div class="kpi-value" style="color:' + riskColors[rt] + '">' + riskCounts[rt] + '</div><div class="kpi-label">' + t(rt) + '</div></div>';
  });

  var sectorNames = allSectors.map(function(s) { return s.sector_en; });
  var heatmapRows = '';
  sectorNames.forEach(function(se) {
    var cells = '';
    riskTypes.forEach(function(rt) {
      var count = allRisks.filter(function(r) { return r.sector_en === se && r.risk_type === rt; }).length;
      var maxCount = 4;
      var intensity = Math.min(count / maxCount, 1);
      var bg = count === 0 ? 'var(--bg-primary)' : 'rgba(239,68,68,' + (intensity * 0.8 + 0.1) + ')';
      cells += '<div class="heatmap-cell" style="background:' + bg + ';color:' + (count > 0 ? '#fff' : 'var(--text-muted)') + '">' + (count || '') + '</div>';
    });
    var sectorObj = allSectors.find(function(s) { return s.sector_en === se; });
    heatmapRows += '<div style="display:grid;grid-template-columns:140px repeat(5,1fr);gap:2px;align-items:center">' +
      '<div style="font-size:10px;color:var(--text-secondary);padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (currentLang === 'zh' ? (sectorObj ? sectorObj.sector_zh : se) : se) + '</div>' +
      cells + '</div>';
  });

  var riskRows = '';
  allRisks.forEach(function(r) {
    var stock = allStocks.find(function(s) { return s.ticker === r.ticker; });
    riskRows += '<tr>' +
      '<td><strong>' + r.ticker + '</strong></td>' +
      '<td>' + (currentLang === 'zh' ? (r.sector_zh || (stock ? stock.sector_zh : '')) : r.sector_en) + '</td>' +
      '<td>' + t(r.risk_type) + '</td>' +
      '<td>' + r.detail + '</td>' +
      '<td><span style="color:' + (r.severity === 'high' ? 'var(--red)' : 'var(--orange)') + '">' + r.severity.toUpperCase() + '</span></td>' +
    '</tr>';
  });

  var riskTypeHeaders = '';
  riskTypes.forEach(function(rt) { riskTypeHeaders += '<div style="font-size:9px;color:var(--text-muted);text-align:center">' + t(rt) + '</div>'; });

  return dataTimestamp() +
    '<div class="kpi-grid">' + kpiHtml + '</div>' +
    '<div class="chart-container"><h3>' + t('risk_heatmap') + '</h3>' +
      '<div style="display:grid;grid-template-columns:140px repeat(5,1fr);gap:2px;margin-bottom:4px"><div></div>' + riskTypeHeaders + '</div>' +
      heatmapRows + '<div style="font-size:10px;color:#64748b;margin-top:8px;text-align:center">' + t('footnote_risk_heatmap') + '</div></div>' +
    '<div class="chart-row"><div class="chart-container"><h3>' + t('risk_radar') + '</h3><canvas id="riskRadarChart"></canvas></div><div></div></div>' +
    '<div class="chart-container"><h3>' + t('risk_detail') + '</h3><div class="table-wrapper" style="max-height:40vh"><table class="data-table"><thead><tr>' +
      '<th>' + t('ticker') + '</th><th>' + t('sector') + '</th><th>' + t('risk_type') + '</th><th>' + t('detail') + '</th><th>' + t('severity') + '</th>' +
    '</tr></thead><tbody>' + riskRows + '</tbody></table></div></div>';
}

function initRiskCharts() {
  var ctx = document.getElementById('riskRadarChart');
  if (!ctx) return;
  var riskTypes = ['pe_negative','price_extreme','high_leverage','liquidity_risk','near_52w_low'];
  var quadrants = ['leading','improving','weakening','lagging'];
  var datasets = [];
  quadrants.forEach(function(q) {
    var qSectors = allSectors.filter(function(s) { return s.quadrant === q; }).map(function(s) { return s.sector_en; });
    var data = riskTypes.map(function(rt) { return allRisks.filter(function(r) { return r.risk_type === rt && qSectors.indexOf(r.sector_en) >= 0; }).length; });
    if (data.some(function(v) { return v > 0; })) {
      datasets.push({
        label: t(q),
        data: data,
        borderColor: QC[q],
        backgroundColor: QC[q] + '33',
        pointBackgroundColor: QC[q],
      });
    }
  });

  new Chart(ctx, {
    type: 'radar',
    data: { labels: riskTypes.map(function(rt) { return t(rt); }), datasets: datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
      scales: { r: { grid: { color: '#2d3748' }, angleLines: { color: '#2d3748' }, pointLabels: { color: '#e2e8f0', font: { size: 10 } }, ticks: { color: '#64748b', backdropColor: 'transparent' } } }
    }
  });
}

// ===== Tab 6: Alerts =====
function renderAlerts() {
  var highAlerts = allRisks.filter(function(r) { return r.severity === 'high'; });
  var bySector = {};
  highAlerts.forEach(function(r) {
    if (!bySector[r.sector_en]) bySector[r.sector_en] = [];
    bySector[r.sector_en].push(r);
  });

  var groups = '';
  Object.keys(bySector).forEach(function(se) {
    var sector = allSectors.find(function(s) { return s.sector_en === se; });
    var items = '';
    bySector[se].forEach(function(r) {
      var icon = r.risk_type === 'pe_negative' ? '📉' : r.risk_type === 'price_extreme' ? '⚡' : r.risk_type === 'high_leverage' ? '⚖️' : r.risk_type === 'liquidity_risk' ? '💧' : '📍';
      items += '<div class="alert-item"><span class="alert-icon">' + icon + '</span><strong>' + r.ticker + '</strong><span>' + r.detail + '</span></div>';
    });
    groups += '<div class="alert-group"><h4><span class="sector-dot" style="background:' + QC[(sector ? sector.quadrant : 'lagging')] + '"></span> ' + sectorName(sector || {sector_en: se, sector_zh: se}) + '</h4>' + items + '</div>';
  });

  return dataTimestamp() +
    '<h3 style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">' + t('high_severity_alerts') + ' (' + highAlerts.length + ')</h3>' +
    (groups || '<div style="color:var(--text-muted)">' + t('no_results') + '</div>');
}

// ===== Tab 7: Decisions =====
function renderDecisions() {
  var quadrantInfo = {
    leading: { title: t('add_position'), icon: '🟢', desc: currentLang === 'zh' ? '相对强弱与动量均强，建议加仓' : 'Strong RS & momentum, add position' },
    improving: { title: t('watch_buy'), icon: '🔵', desc: currentLang === 'zh' ? '动量改善中，关注买入时机' : 'Improving momentum, watch for entry' },
    weakening: { title: t('reduce_position'), icon: '🟡', desc: currentLang === 'zh' ? '动量减弱，考虑减仓' : 'Weakening momentum, consider reducing' },
    lagging: { title: t('avoid_watch'), icon: '🔴', desc: currentLang === 'zh' ? '相对强弱与动量均弱，回避或观望' : 'Weak RS & momentum, avoid or watch' }
  };

  var cards = '';
  Object.keys(quadrantInfo).forEach(function(q) {
    var info = quadrantInfo[q];
    var qSectors = allSectors.filter(function(s) { return s.quadrant === q; });
    var liHtml = '';
    qSectors.forEach(function(s) {
      liHtml += '<li><span class="sector-dot" style="background:' + QC[q] + '"></span>' + sectorName(s) + ' <span style="color:var(--text-muted)">(' + s.stock_count + ')</span></li>';
    });
    cards += '<div class="decision-card" style="border-left:3px solid ' + QC[q] + '">' +
      '<h3>' + info.icon + ' ' + info.title + '</h3>' +
      '<p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">' + info.desc + '</p>' +
      '<ul>' + liHtml + '</ul></div>';
  });

  return dataTimestamp() + '<div class="decision-grid">' + cards + '</div>';
}

// ===== Tab 8: Stock Pool =====
function getPoolStocks() {
  var overrides = stockPoolOverrides || {};
  var removed = overrides.removed || [];
  var added = overrides.added || [];
  var pool = allStocks.filter(function(s) { return removed.indexOf(s.ticker) < 0; });
  added.forEach(function(a) {
    if (!pool.find(function(s) { return s.ticker === a.ticker; })) {
      pool.push({ ticker: a.ticker, sector_en: a.sector_en, sector_zh: a.sector_zh || a.sector_en, company_name: a.company_name || a.ticker, close: 0, change_pct: 0, volume: 0, pe: 0, market_cap: 0, gross_margin: 0, notes: a.notes || '' });
    }
  });
  return pool;
}

function renderPool() {
  var pool = getPoolStocks();
  var bySector = {};
  pool.forEach(function(s) {
    var se = s.sector_en;
    if (!bySector[se]) bySector[se] = [];
    bySector[se].push(s);
  });

  var sectorOptions = '';
  allSectors.forEach(function(s) {
    sectorOptions += '<option value="' + s.sector_en + '">' + (currentLang === 'zh' ? s.sector_zh : s.sector_en) + '</option>';
  });

  var sectorGroups = '';
  Object.keys(bySector).forEach(function(se) {
    var sector = allSectors.find(function(s) { return s.sector_en === se; });
    var stockItems = '';
    bySector[se].forEach(function(s) {
      var noteHtml = s.notes ? '<span style="color:var(--accent);font-size:10px">[' + s.notes + ']</span>' : '';
      stockItems += '<div class="pool-stock-item"><strong>' + s.ticker + '</strong>' +
        '<span style="color:var(--text-muted)">' + (TICKER_NAMES[s.ticker] || s.company_name || '') + '</span>' +
        noteHtml + '<span style="flex:1"></span>' +
        '<button class="remove-btn" onclick="removeFromPool(\'' + s.ticker + '\')" title="' + t('remove') + '">✕</button></div>';
    });
    sectorGroups += '<div class="pool-sector-group"><h4><span class="sector-dot" style="background:' + QC[(sector ? sector.quadrant : 'lagging')] + '"></span> ' + sectorName(sector || {sector_en: se, sector_zh: se}) + ' <span style="color:var(--text-muted);font-size:11px">(' + bySector[se].length + ')</span></h4>' + stockItems + '</div>';
  });

  return dataTimestamp() +
    '<div class="pool-overview">' +
      '<div class="kpi-card"><div class="kpi-value" style="color:var(--accent)">' + pool.length + '</div><div class="kpi-label">' + t('pool_total') + '</div></div>' +
      '<div class="kpi-card"><div class="kpi-value" style="color:var(--cyan)">' + Object.keys(bySector).length + '</div><div class="kpi-label">' + t('total_sectors') + '</div></div>' +
    '</div>' +
    '<div class="add-form">' +
      '<div class="field"><label>' + t('ticker') + '</label><input id="poolTicker" placeholder="e.g. NVDA" style="width:100px"></div>' +
      '<div class="field"><label>' + t('sector') + '</label><select id="poolSector" style="width:180px">' + sectorOptions + '</select></div>' +
      '<div class="field"><label>' + t('notes') + '</label><input id="poolNotes" placeholder="' + (currentLang === 'zh' ? '可选备注' : 'Optional notes') + '" style="width:150px"></div>' +
      '<button class="add-btn" onclick="addToPool()">' + t('add_stock') + '</button>' +
    '</div>' + sectorGroups;
}

function addToPool() {
  var ticker = document.getElementById('poolTicker').value.trim().toUpperCase();
  var sector = document.getElementById('poolSector').value;
  var notes = document.getElementById('poolNotes').value.trim();
  if (!ticker) return;
  if (!stockPoolOverrides.added) stockPoolOverrides.added = [];
  if (!stockPoolOverrides.removed) stockPoolOverrides.removed = [];
  stockPoolOverrides.removed = stockPoolOverrides.removed.filter(function(t) { return t !== ticker; });
  var existingStock = allStocks.find(function(s) { return s.ticker === ticker; });
  if (!existingStock && !stockPoolOverrides.added.find(function(a) { return a.ticker === ticker; })) {
    var sectorObj = allSectors.find(function(s) { return s.sector_en === sector; });
    stockPoolOverrides.added.push({ ticker: ticker, sector_en: sector, sector_zh: (sectorObj ? sectorObj.sector_zh : sector), company_name: TICKER_NAMES[ticker] || ticker, notes: notes });
  }
  localStorage.setItem('ai_tracker_stock_pool_overrides', JSON.stringify(stockPoolOverrides));
  renderTabPanels();
}

function removeFromPool(ticker) {
  if (!stockPoolOverrides.removed) stockPoolOverrides.removed = [];
  if (stockPoolOverrides.removed.indexOf(ticker) < 0) { stockPoolOverrides.removed.push(ticker); }
  if (stockPoolOverrides.added) { stockPoolOverrides.added = stockPoolOverrides.added.filter(function(a) { return a.ticker !== ticker; }); }
  localStorage.setItem('ai_tracker_stock_pool_overrides', JSON.stringify(stockPoolOverrides));
  renderTabPanels();
}

// ========== Global Search ==========
function handleGlobalSearch(query) {
  searchQuery = query.trim();
  if (currentTab === 3) renderTabPanels();
  var sectorItems = document.querySelectorAll('.sector-list-item');
  sectorItems.forEach(function(item) {
    if (!searchQuery) { item.style.display = ''; return; }
    var text = item.textContent.toLowerCase();
    item.style.display = text.indexOf(searchQuery.toLowerCase()) >= 0 ? '' : 'none';
  });
}

// ========== Stock Modal ==========
function showStockModal(ticker) {
  var stock = allStocks.find(function(s) { return s.ticker === ticker; });
  if (!stock) return;
  var name = TICKER_NAMES[ticker] || ticker;
  var sector = allSectors.find(function(s) { return s.sector_en === stock.sector_en; });
  var stockRisks = allRisks.filter(function(r) { return r.ticker === ticker; });
  var sectorStocks = allStocks.filter(function(s) { return s.sector_en === stock.sector_en; }).sort(function(a,b) { return b.change_pct - a.change_pct; });
  var rank = sectorStocks.findIndex(function(s) { return s.ticker === ticker; }) + 1;

  var riskHtml = '';
  if (stockRisks.length > 0) {
    riskHtml = '<div style="margin-top:12px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">' + (currentLang === 'zh' ? '风险标记' : 'Risk Flags') + '</div>';
    stockRisks.forEach(function(r) {
      riskHtml += '<span style="display:inline-block;padding:2px 8px;margin:2px;border-radius:3px;font-size:11px;background:' + (r.severity === 'high' ? 'var(--red)' : 'var(--orange)') + '22;color:' + (r.severity === 'high' ? 'var(--red)' : 'var(--orange)') + '">' + t(r.risk_type) + ': ' + r.detail + '</span>';
    });
    riskHtml += '</div>';
  }

  document.getElementById('modalContent').innerHTML =
    '<div class="modal-header"><h3>' + ticker + ' - ' + name + '</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
    '<canvas class="sparkline-canvas" id="sparklineCanvas"></canvas>' +
    '<div style="font-size:10px;color:#64748b;text-align:center;margin-top:2px">' + t('footnote_sparkline') + ' | 07/21 - 07/25</div>' +
    '<div class="modal-grid">' +
      '<div class="modal-field"><div class="label">' + t('sector') + '</div><div class="value">' + sectorName(sector || {sector_en: stock.sector_en, sector_zh: stock.sector_zh}) + '</div></div>' +
      '<div class="modal-field"><div class="label">' + t('close') + '</div><div class="value">$' + stock.close.toFixed(2) + '</div></div>' +
      '<div class="modal-field"><div class="label">' + t('change_pct') + '</div><div class="value ' + pctClass(stock.change_pct) + '">' + formatPct(stock.change_pct) + '</div></div>' +
      '<div class="modal-field"><div class="label">' + t('volume') + '</div><div class="value">' + formatVolume(stock.volume) + '</div></div>' +
      '<div class="modal-field"><div class="label">' + t('pe') + '</div><div class="value">' + (stock.pe ? stock.pe.toFixed(1) : 'N/A') + '</div></div>' +
      '<div class="modal-field"><div class="label">' + t('market_cap') + '</div><div class="value">' + formatMktCap(stock.market_cap) + '</div></div>' +
      '<div class="modal-field"><div class="label">' + t('gross_margin') + '</div><div class="value">' + (stock.gross_margin ? stock.gross_margin.toFixed(1) + '%' : 'N/A') + '</div></div>' +
      '<div class="modal-field"><div class="label">' + (currentLang === 'zh' ? '板块排名' : 'Sector Rank') + '</div><div class="value">#' + rank + ' / ' + sectorStocks.length + '</div></div>' +
    '</div>' + riskHtml;

  document.getElementById('modalOverlay').classList.add('show');
  requestAnimationFrame(function() { drawSparkline(stock); });
}

function drawSparkline(stock) {
  var canvas = document.getElementById('sparklineCanvas');
  if (!canvas) return;
  var base = stock.close / (1 + stock.change_pct / 100);
  var points = [];
  for (var i = 0; i < 7; i++) {
    var noise = (Math.random() - 0.5) * stock.close * 0.03;
    if (i < 6) points.push(base + (stock.close - base) * (i / 6) + noise);
    else points.push(stock.close);
  }
  var dpr = window.devicePixelRatio || 1;
  var W = canvas.offsetWidth;
  var H = 60;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var min = Math.min.apply(null, points);
  var max = Math.max.apply(null, points);
  var range = max - min || 1;
  ctx.beginPath();
  points.forEach(function(p, i) {
    var x = (i / (points.length - 1)) * W;
    var y = H - 8 - ((p - min) / range) * (H - 16);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = stock.change_pct >= 0 ? '#10b981' : '#ef4444';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = (stock.change_pct >= 0 ? '#10b981' : '#ef4444') + '22';
  ctx.fill();
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

  main.style.marginLeft = sb.classList.contains('collapsed') ? '0' : 'var(--sidebar-width)';
