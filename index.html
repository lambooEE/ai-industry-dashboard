<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg0:#0a0e17;--bg1:#111827;--bg2:#1a2332;--bg3:#243044;--border:#2d3a4f;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#3b82f6;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4;--sidebar-w:280px;--navbar-h:56px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg0);color:var(--text);overflow-x:hidden}
.navbar{position:fixed;top:0;left:0;right:0;height:var(--navbar-h);background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100;gap:16px}
.navbar .logo{font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap}
.navbar .market-status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.navbar .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.navbar .date-info{font-size:13px;color:var(--text3)}
.navbar .spacer{flex:1}
.navbar .lang-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.navbar .lang-btn:hover{background:var(--accent);border-color:var(--accent)}
.sidebar{position:fixed;top:var(--navbar-h);left:0;width:var(--sidebar-w);height:calc(100vh - var(--navbar-h));background:var(--bg1);border-right:1px solid var(--border);overflow-y:auto;padding:16px;z-index:90}
.sidebar h3{font-size:12px;text-transform:uppercase;color:var(--text3);letter-spacing:1px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sidebar h3:first-child{margin-top:0}
.sidebar .stat{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.sidebar .stat .label{color:var(--text2)}
.sidebar .stat .value{font-weight:600}
.sidebar .arch-item{padding:6px 0;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.sidebar .arch-item .name{color:var(--text2)}
.sidebar .arch-item .count{background:var(--bg3);padding:2px 8px;border-radius:10px;font-size:11px;color:var(--text3)}
.sidebar .quad-item{padding:4px 0;font-size:12px;display:flex;align-items:center;gap:6px}
.sidebar .quad-dot{width:10px;height:10px;border-radius:50%}
.main{margin-left:var(--sidebar-w);margin-top:var(--navbar-h);padding:20px 24px;min-height:calc(100vh - var(--navbar-h))}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.tab-btn:hover{background:var(--bg3);color:var(--text)}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden}
.card .card-label{font-size:12px;color:var(--text3);margin-bottom:4px}
.card .card-value{font-size:28px;font-weight:700}
.card .card-sub{font-size:12px;color:var(--text2);margin-top:4px}
.card.green .card-value{color:var(--green)}.card.red .card-value{color:var(--red)}.card.blue .card-value{color:var(--blue)}.card.orange .card-value{color:var(--orange)}.card.purple .card-value{color:var(--purple)}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.card.green::after{background:var(--green)}.card.red::after{background:var(--red)}.card.blue::after{background:var(--blue)}.card.orange::after{background:var(--orange)}.card.purple::after{background:var(--purple)}
.chart-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px}
.chart-box h2{font-size:16px;margin-bottom:16px;color:var(--text)}
.chart-wrap{position:relative;height:400px}
.table-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;overflow-x:auto}
.table-box h2{font-size:16px;margin-bottom:12px}
.table-filters{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.table-filters input,.table-filters select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;outline:none}
.table-filters input:focus,.table-filters select:focus{border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--border);color:var(--text3);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover{background:rgba(59,130,246,.06)}
.up{color:var(--green)}.down{color:var(--red)}
.quad-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px}
.quad-box h2{font-size:16px;margin-bottom:16px}
.risk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.risk-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px}
.risk-card .rc-label{font-size:12px;color:var(--text3)}
.risk-card .rc-value{font-size:24px;font-weight:700;margin:4px 0}
.alert-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.alert-badge.high{background:rgba(239,68,68,.2);color:var(--red)}
.alert-badge.medium{background:rgba(245,158,11,.2);color:var(--orange)}
.decision-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.decision-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px}
.decision-card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.decision-card p{font-size:13px;color:var(--text2);line-height:1.6}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag.leading{background:rgba(16,185,129,.2);color:var(--green)}
.tag.improving{background:rgba(59,130,246,.2);color:var(--blue)}
.tag.weakening{background:rgba(245,158,11,.2);color:var(--orange)}
.tag.lagging{background:rgba(239,68,68,.2);color:var(--red)}
.macro-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.macro-card h2{font-size:16px;margin-bottom:12px}
.macro-card p{font-size:14px;color:var(--text2);line-height:1.8}
.macro-card .info-row{display:flex;gap:24px;margin-top:12px;flex-wrap:wrap}
.macro-card .info-item{font-size:13px}
.macro-card .info-item .il{color:var(--text3);font-size:12px}
.macro-card .info-item .iv{font-weight:600;margin-top:2px}
.sort-asc::after{content:' \u25B2';font-size:10px}
.sort-desc::after{content:' \u25BC';font-size:10px}
</style>

/* ========== FORMATTERS ========== */
function fmtPct(v) { return v == null ? '-' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function fmtMcap(v) {
  if (v == null) return '-';
  if (v >= 1e12) return (v/1e12).toFixed(2) + 'T';
  if (v >= 1e9) return (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v/1e6).toFixed(2) + 'M';
  return v.toFixed(0);
}
function fmtVol(v) {
  if (v == null) return '-';
  if (v >= 1e9) return (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return v.toFixed(0);
}
function fmtN(v, d) { return v == null ? '-' : v.toFixed(d == null ? 2 : d); }

  var L3 = ['Data Center & Neocloud','Optical Interconnect & Photonics','AI Networking & Switching'];

  var L1 = ['Edge AI & Physical AI','Robotics & ADAS'];
  if (L5.indexOf(name) >= 0) return currentLang === 'zh' ? 'L5 算力' : 'L5 Compute';
  if (L4.indexOf(name) >= 0) return currentLang === 'zh' ? 'L4 芯片/设备' : 'L4 Chip/WFE';

function drawSectorPerf() {
  var ctx = document.getElementById('chartSP');
  if (!ctx) return;
  if (chartSP) { chartSP.destroy(); chartSP = null; }
  var sorted = allSectors.slice().sort(function(a,b){return a.avg_1m_return - b.avg_1m_return});
  var labels = sorted.map(function(s){return currentLang === 'zh' ? s.sector_zh : s.sector_en});
  var data = sorted.map(function(s){return s.avg_1m_return});
  var colors = sorted.map(function(s){return s.avg_1m_return >= 0 ? 'rgba(16,185,129,.7)' : 'rgba(239,68,68,.7)'});
  chartSP = new Chart(ctx, {
    type:'bar',
    data:{labels:labels, datasets:[{label:t('avg1mReturn'),data:data,backgroundColor:colors,borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'#94a3b8',callback:function(v){return v+'%'}}},
        y:{grid:{display:false},ticks:{color:'#e2e8f0',font:{size:11}}}
      }
    }
  });
}

function drawQuadrant() {
  var canvas = document.getElementById('qCanvas');
  if (!canvas) return;
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  var W = Math.max(800, rect.width - 40);
  var H = 600;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  var pad = 60;
  var cw = W - pad * 2;
  var ch = H - pad * 2;

  var rsVals = allSectors.map(function(s){return s.relative_strength});
  var mcVals = allSectors.map(function(s){return s.momentum_change});
  var rsMin = Math.min(0, Math.min.apply(null, rsVals) - 50);
  var rsMax = Math.max(0, Math.max.apply(null, rsVals) + 50);
  var mcMin = Math.min(0, Math.min.apply(null, mcVals) - 50);
  var mcMax = Math.max(0, Math.max.apply(null, mcVals) + 50);

  function xM(v){return pad + (v - rsMin) / (rsMax - rsMin) * cw}
  function yM(v){return pad + (mcMax - v) / (mcMax - mcMin) * ch}

  var cx = xM(0), cy = yM(0);

  // Quadrant backgrounds
  ctx.fillStyle = 'rgba(16,185,129,.04)'; ctx.fillRect(cx, pad, W - pad - cx, cy - pad);
  ctx.fillStyle = 'rgba(59,130,246,.04)'; ctx.fillRect(pad, pad, cx - pad, cy - pad);
  ctx.fillStyle = 'rgba(245,158,11,.04)'; ctx.fillRect(cx, cy, W - pad - cx, H - pad - cy);
  ctx.fillStyle = 'rgba(239,68,68,.04)'; ctx.fillRect(pad, cy, cx - pad, H - pad - cy);

  // Axes
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, cy); ctx.lineTo(W - pad, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, pad); ctx.lineTo(cx, H - pad); ctx.stroke();

  // Axis labels
  ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(t('relativeStrength'), W / 2, H - 10);
  ctx.save(); ctx.translate(14, H / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(t('momentumChange'), 0, 0); ctx.restore();

  // Quadrant labels
  ctx.font = '13px sans-serif'; ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#10b981'; ctx.fillText(t('quadLeading'), cx + (W - pad - cx) / 2, pad + 20);
  ctx.fillStyle = '#3b82f6'; ctx.fillText(t('quadImproving'), pad + (cx - pad) / 2, pad + 20);
  ctx.fillStyle = '#f59e0b'; ctx.fillText(t('quadWeakening'), cx + (W - pad - cx) / 2, H - pad - 10);
  ctx.fillStyle = '#ef4444'; ctx.fillText(t('quadLagging'), pad + (cx - pad) / 2, H - pad - 10);
  ctx.globalAlpha = 1;

  // Bubbles
  var maxSc = Math.max.apply(null, allSectors.map(function(s){return s.stock_count}));
  allSectors.forEach(function(s) {
    var x = xM(s.relative_strength);
    var y = yM(s.momentum_change);
    var r = Math.max(14, 8 + (s.stock_count / maxSc) * 28);
    var c = QC[s.quadrant];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = c.bg; ctx.fill();
    ctx.strokeStyle = c.border; ctx.lineWidth = 2; ctx.stroke();
    var abbr = SA[s.sector_en] || s.sector_en.substring(0, 3);
    ctx.fillStyle = c.text; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(abbr, x, y);
  });
}

/* ========== QUOTES ========== */
function renderQuotes() {
  var p = document.getElementById('panel_tabQuotes');
  var opts = '<option value="">' + t('filterSector') + '</option>';
  var seen = {};
  allSectors.forEach(function(s) {
    if (!seen[s.sector_en]) {
      seen[s.sector_en] = 1;
      opts += '<option value="' + s.sector_en + '">' + (currentLang === 'zh' ? s.sector_zh : s.sector_en) + '</option>';
    }
  });

  var h = '<div class="table-box"><h2>' + t('tabQuotes') + ' (' + allStocks.length + ')</h2>';
  h += '<div class="table-filters">';
  h += '<input type="text" id="qSearch" placeholder="' + t('search') + '" value="' + qFilter + '" oninput="onQF()">';
  h += '<select id="qSel" onchange="onQS()">' + opts + '</select>';
  h += '</div>';
  h += '<div style="overflow-x:auto"><table id="qTable"></table></div></div>';
  p.innerHTML = h;
  document.getElementById('qSel').value = qSectorFilter;
  renderQTable();
}

function onQF() { qFilter = document.getElementById('qSearch').value.toUpperCase(); renderQTable(); }
function onQS() { qSectorFilter = document.getElementById('qSel').value; renderQTable(); }

function renderQTable() {
  var tbl = document.getElementById('qTable');
  if (!tbl) return;
  var filtered = allStocks.filter(function(s) {
    if (qFilter && s.ticker.indexOf(qFilter) < 0) return false;
    if (qSectorFilter && s.sector_en !== qSectorFilter) return false;
    return true;
  });
  filtered.sort(function(a, b) {
    var va = a[qSortKey], vb = b[qSortKey];
    if (typeof va === 'string') return va.localeCompare(vb) * qSortDir;
    return (va - vb) * qSortDir;
  });

  var cols = [
    {k:'ticker', l:t('ticker')}, {k:'_name', l:t('name')}, {k:'_sector', l:t('sector')},
    {k:'close', l:t('close')}, {k:'change_pct', l:t('change')}, {k:'volume', l:t('volume')},
    {k:'pe', l:t('pe')}, {k:'market_cap', l:t('marketCap')}, {k:'gross_margin', l:t('grossMargin')}
  ];

  var h = '<thead><tr>';
  cols.forEach(function(c) {
    var cls = c.k === qSortKey ? (qSortDir === 1 ? 'sort-asc' : 'sort-desc') : '';
    h += '<th class="' + cls + '" onclick="sortQ(\'' + c.k + '\')">' + c.l + '</th>';
  });
  h += '</tr></thead><tbody>';

  filtered.forEach(function(s) {
    var cc = s.change_pct >= 0 ? 'up' : 'down';
    var sn = currentLang === 'zh' ? s.sector_zh : s.sector_en;
    var nm = TICKER_NAMES[s.ticker] || s.ticker;
    h += '<tr>';
    h += '<td style="font-weight:600">' + s.ticker + '</td>';
    h += '<td>' + nm + '</td>';
    h += '<td style="font-size:11px;color:var(--text2)">' + sn + '</td>';
    h += '<td>' + fmtN(s.close, 2) + '</td>';
    h += '<td class="' + cc + '">' + fmtPct(s.change_pct) + '</td>';
    h += '<td>' + fmtVol(s.volume) + '</td>';
    h += '<td>' + (s.pe < 0 ? '<span class="down">' + fmtN(s.pe, 1) + '</span>' : fmtN(s.pe, 1)) + '</td>';
    h += '<td>' + fmtMcap(s.market_cap) + '</td>';
    h += '<td>' + fmtN(s.gross_margin, 1) + '</td>';
    h += '</tr>';
  });
  h += '</tbody>';
  tbl.innerHTML = h;
}

function sortQ(key) {
  if (qSortKey === key) qSortDir *= -1;
  else { qSortKey = key; qSortDir = 1; }
  renderQTable();
}

/* ========== RISK ========== */
function renderRisk() {
  var p = document.getElementById('panel_tabRisk');
  var hr = allRisks.filter(function(r){return r.severity==='high'}).length;
  var mr = allRisks.filter(function(r){return r.severity==='medium'}).length;

  var tl = {price_extreme:t('priceExtreme'),high_leverage:t('highLeverage'),pe_negative:t('peNegative'),liquidity_risk:t('liquidityRisk'),near_52w_low:t('near52wLow')};

  var h = '<div class="cards">';
  h += mkCard(t('totalRisks'), allRisks.length, '', 'orange');
  h += mkCard(t('highRisk'), hr, '', 'red');
  h += mkCard(t('mediumRisk'), mr, '', 'blue');
  h += '</div>';

  h += '<div class="table-box"><h2>' + t('riskByType') + '</h2>';
  h += '<table><thead><tr><th>' + t('ticker') + '</th><th>' + t('sector') + '</th><th>Type</th><th>Detail</th><th>Severity</th></tr></thead><tbody>';
  allRisks.forEach(function(r) {
    var sc = r.severity === 'high' ? 'high' : 'medium';
    var sn = currentLang === 'zh' ? r.sector_zh : r.sector_en;
    h += '<tr><td style="font-weight:600">' + r.ticker + '</td><td style="font-size:11px;color:var(--text2)">' + sn + '</td><td>' + (tl[r.risk_type]||r.risk_type) + '</td><td>' + r.detail + '</td><td><span class="alert-badge ' + sc + '">' + r.severity.toUpperCase() + '</span></td></tr>';
  });
  h += '</tbody></table></div>';
  p.innerHTML = h;
}

/* ========== ALERTS ========== */
function renderAlerts() {
  var p = document.getElementById('panel_tabAlerts');
  var alerts = allStocks.filter(function(s){return Math.abs(s.change_pct) > 5})
    .sort(function(a,b){return Math.abs(b.change_pct) - Math.abs(a.change_pct)});

  var h = '<div class="table-box">';
  h += '<h2>' + t('alertTitle') + '</h2>';
  h += '<p style="font-size:13px;color:var(--text2);margin-bottom:16px">' + t('alertDesc') + '</p>';
  h += '<table><thead><tr><th>' + t('ticker') + '</th><th>' + t('name') + '</th><th>' + t('sector') + '</th><th>' + t('change') + '</th><th>' + t('close') + '</th><th>' + t('volume') + '</th></tr></thead><tbody>';
  alerts.forEach(function(s) {
    var cc = s.change_pct >= 0 ? 'up' : 'down';
    var badge = Math.abs(s.change_pct) > 8 ? 'high' : 'medium';
    var sn = currentLang === 'zh' ? s.sector_zh : s.sector_en;
    var nm = TICKER_NAMES[s.ticker] || s.ticker;
    h += '<tr><td style="font-weight:600">' + s.ticker + '</td><td>' + nm + '</td><td style="font-size:11px;color:var(--text2)">' + sn + '</td><td class="' + cc + '">' + fmtPct(s.change_pct) + ' <span class="alert-badge ' + badge + '">' + (s.change_pct >= 0 ? 'UP' : 'DN') + '</span></td><td>' + fmtN(s.close, 2) + '</td><td>' + fmtVol(s.volume) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  p.innerHTML = h;
}

/* ========== DECISIONS ========== */
function renderDecisions() {
  var p = document.getElementById('panel_tabDecisions');
  var h = '<h2 style="margin-bottom:16px">' + t('decisionTitle') + '</h2>';
  h += '<div class="decision-grid">';

  var qo = ['leading','improving','weakening','lagging'];
  qo.forEach(function(q) {
    var secs = allSectors.filter(function(s){return s.quadrant === q});
    if (secs.length === 0) return;
    var ak = q + 'Advice';
    secs.forEach(function(s) {
      var sn = currentLang === 'zh' ? s.sector_zh : s.sector_en;
      var qn = t('quad' + q.charAt(0).toUpperCase() + q.slice(1));
      h += '<div class="decision-card">';
      h += '<h3><span class="tag ' + q + '">' + qn + '</span> ' + sn + '</h3>';
      h += '<p>' + t(ak) + '</p>';
      h += '<p style="margin-top:8px;font-size:12px">' + t('avg1mReturn') + ': ' + fmtPct(s.avg_1m_return) + ' | ' + t('stockCount') + ': ' + s.stock_count + '</p>';
      h += '</div>';
    });
  });
  h += '</div>';
  p.innerHTML = h;
}

/* ========== INIT ========== */
window.addEventListener('DOMContentLoaded', function() {
  renderAll();
});
